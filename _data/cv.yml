    link: https://fuelrats.com
    role: Tech Rat, Server Administrator, Script Automation, Full Stack Developer
    description: >-
      Here at Fuel Rats (which is a gaming community for the game Elite: Dangerous), I started out as a normal ”Rat”, who helped people in-game to get refuelled if they had run out while travelling the galaxy, after a while, I was promoted to ”Tech Rat”, which is one of the founding pillars of the server stack that keeps the operation going, from IRC servers, to websites and apps with everything in context of the game and our community Fuel Rats.
