  - id: journal-limpet
    period: Mar 2022 - Present Day
    company: Journal Limpet
    link: https://journal-limpet.com
    role: Owner
    description: >-
      Journal Limpet is my service for users in the game Elite: Dangerous to store all their game journals (automatic from the game), and have third party integrations with other services that ingest these journals, to allow more services to find more data about the game, outside the game itself. I have over 1 500 users registered, with their journal data. This is a project I setup for myself to learn more about automation in several aspects. It has been running more or less flawlessly since December 2020, funded by myself, and some people on Patreon.
    order: 50

  - id: multinet
    period: Feb 2006 - Oct 2026
    company: MultiNet Interactive AB
    link: https://www.multinet.com
    role: CISO, Senior Fullstack Developer, IT-Infrastructure Manager, IT-DevOps, DBA
    description: >-
      Systems and server administration, full stack developer across several public facing SaaS and a lot of internal tooling. Started out as a developer for one of our SaaS that needed some TLC, ended up being the administrator of that service. Later advanced to maintaining an older PHP application which we later made a total rewrite of so that more developers could pitch in later. As the years went, I started getting more and more access to servers, databases and infrastructure, as I found it interesting and fun. This is how it started, as I gained more and more ”roles” internally, so basically started out as the new infrastructure intern, helping setting up new servers, rotating backup tapes, making sure that it is properly ventilated in our server room. Going on, we later started using a rented rackspace, where we migrated all our internal servers to, with as low downtime for all services as possible. And now I mainly make sure that we’re following all policies and procedures we’ve setup for ourself, making sure that all servers are running as they should, and plan for redundancy in all possible ways to keep our server stack healthy and easy to maintain.
    order: 60

  - id: fuelrats
