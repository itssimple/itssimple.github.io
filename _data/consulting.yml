  # Database Engineering & Performance (database-engineering)
  - id: sql-server-performance-tuning
    category: database-engineering
    title: SQL Server Performance Tuning & Query Optimization
    description: >-
      Deep-dive analysis of server bottlenecks (Wait Stats, Parameter Sniffing, heavy execution plans) and optimization of source code, queries, and indexing.
    price: 1500
    pricing: hourly
    order: 10
  - id: index-statistics-overhaul
    category: database-engineering
    title: Index & Statistics Strategy Overhaul
    description: >-
      Identification and removal of unused indexes, implementation of missing indexes, and optimization of scheduled maintenance jobs for database statistics.
    price: 1400
    pricing: hourly
    order: 20
  - id: db-code-review
    category: database-engineering
    title: Database Code Review for Development Teams
    description: >-
      Proactive audit of ORM-generated queries (Entity Framework, NHibernate, etc.) to eliminate N+1 problems and inefficient data access patterns before code hits production.
    price: 1400
    pricing: hourly
    order: 30
  - id: sql-server-health-check
    category: database-engineering
    title: SQL Server Health Check & Risk Assessment
    description: >-
      Comprehensive review of SQL Server configuration (MAXDOP, Cost Threshold for Parallelism, TempDB allocation) and identification of hidden performance risks based on industry best practices.
    price: 15000
    pricing: fixed
    order: 40

